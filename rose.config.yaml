# Rose ROS Bag Processing Tool - Configuration File
#
# This file defines the configuration for Rose.
# All settings are optional - defaults will be used if not specified.
#
# You can also override settings with environment variables:
#   ROSE_<SETTING_NAME>=value (e.g., ROSE_PARALLEL_WORKERS=8)
#
# Configuration hierarchy (highest to lowest priority):
#   1. Command-line arguments
#   2. Environment variables (ROSE_*)
#   3. Configuration file (rose.config.yaml)
#   4. System defaults

# ==============================================================================
# Performance Settings
# ==============================================================================

# Number of parallel workers for bag processing
# Default: 4
parallel_workers: 4

# Memory limit for operations in MB
# Range: 128-8192, Default: 512
memory_limit_mb: 512

# ==============================================================================
# Feature Toggles
# ==============================================================================

# Enable caching system
# Default: true
enable_cache: true

# Enable plugin system
# Default: true
enable_plugins: true

# ==============================================================================
# Default Behavior
# ==============================================================================

# Default compression type for extracted bags
# Options: none, bz2, lz4
# Default: none
compression_default: none

# Enable verbose output by default
# Default: false
verbose_default: false

# Build pandas DataFrame index by default during load
# Default: false
build_index_default: false

# ==============================================================================
# Logging Settings
# ==============================================================================

# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
# Default: INFO
log_level: INFO

# Write logs to file
# Default: true
log_to_file: true

# ==============================================================================
# UI Settings
# ==============================================================================

# Path to theme YAML file
# Default: rose.theme.default.yaml
theme_file: rose.theme.default.yaml

# Enable colored output
# Default: true
enable_colors: true

# ==============================================================================
# Directory Settings
# ==============================================================================

# Default output directory for extracted bags
# Default: output
output_directory: output

# Directory for cache storage
# Default: ~/.cache/rose
# cache_dir: ~/.cache/rose

# Directory for log files
# Default: logs
# logs_dir: logs

# Directory for user plugins
# Default: ~/.rose/plugins
# plugins_dir: ~/.rose/plugins
