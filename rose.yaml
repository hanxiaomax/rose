# Rose Configuration File
# Basic configuration for Rose ROS Bag Processing Tool
# For all options, see rose.yaml.example

# Performance settings
parallel_workers: 4
cache_ttl_seconds: 300
memory_limit_mb: 512

# Default behaviors
verbose_default: false
build_index_default: false
auto_cache_default: true
compression_default: none

# File settings
output_directory: "output"

# Feature flags
enable_plugins: true

# Logging
log_level: "INFO"
log_to_file: true

# UI settings
theme: "cassette-walkman"
enable_colors: true


